# git-hooks-collection configuration.
# Enable/disable a check by editing the lists under 'hooks:' below.
# Thresholds for each check follow. Docs: see the project README.
version: 1

hooks:
  pre-commit:
    - secrets
    - large-files
    - branch-protect
    - format
    - lint
  prepare-commit-msg:
    - issue-prefix
  commit-msg:
    - conventional-commit
  pre-push:
    - secrets-push
    - no-fixup
    - tests

secrets:                        # also used by secrets-push
  scan: diff                    # diff = only the lines being added; file = whole files
  max_file_bytes: 1000000       # skip files (or added text) larger than this
  entropy_threshold: 3.2        # generic-assignment gate; lower = stricter
  exclude:                      # globs, matched against the full path and the file name
    - "*.min.js"
    - "*.lock"
    - "package-lock.json"
    - "poetry.lock"
    - "yarn.lock"
    - "pnpm-lock.yaml"
  allow_regex: []               # matched values are treated as non-secrets

large_files:
  max_bytes: 5242880            # 5 MiB hard limit
  warn_bytes: 1048576           # 1 MiB soft warning
  lfs_hint: true

branch_protect:
  protected:
    - main
    - master
  allow_env: ALLOW_COMMIT_TO_PROTECTED

format:
  autostage: true               # re-stage what the formatter rewrote (fully staged files only)
  exclude:                      # never formatted (globs, matched against path and file name)
    - ".githooks/*"             # the vendored hooks themselves
  tools:
    python:
      - ruff format
      - black
    javascript:
      - prettier --write
    web:                        # .json .css .scss .html .md .yaml .yml
      - prettier --write

lint:
  fail_on_error: true
  exclude:
    - ".githooks/*"
  tools:
    python:
      - ruff check
    javascript:
      - eslint

conventional_commit:
  types:
    - feat
    - fix
    - docs
    - style
    - refactor
    - perf
    - test
    - build
    - ci
    - chore
    - revert
  max_header_length: 72
  min_subject_length: 1
  require_scope: false
  allow_breaking: true
  ignore_prefix_regex: '^\[[A-Z][A-Z0-9]+-\d+\]\s*'   # tolerate '[ABC-123] feat: ...'

issue_prefix:
  mode: trailer                 # trailer = append 'Refs: ABC-123'; prefix = prepend template
  trailer_key: Refs
  branch_regex: '([A-Z][A-Z0-9]+-\d+)'
  template: '[{issue}] '        # only used when mode is 'prefix'
  skip_sources:
    - merge
    - squash
    - commit

tests:
  command: ''                   # empty = auto-detect pytest / npm test
  timeout_seconds: 120
  auto_detect: true

no_fixup:
  block_patterns:
    - "fixup!"
    - "squash!"
    - "amend!"
    - "WIP"
    - "wip:"
